services:
  postgres:
    image: postgres:16-alpine
    container_name: acadex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acadexdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-acadexdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - acadex-network

  backend:
    build:
      context: ./backend
      dockerfile: Acadex.Api/Dockerfile
    container_name: acadex-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-acadexdb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Secret: ${JWT_SECRET:-Acadex_SuperSecret_Jwt_Security_Key_2026_Minimum32Characters!}
      Jwt__Issuer: ${JWT_ISSUER:-AcadexApi}
      Jwt__Audience: ${JWT_AUDIENCE:-AcadexClient}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - acadex-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: acadex-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      - backend
    networks:
      - acadex-network

volumes:
  postgres_data:
    driver: local

networks:
  acadex-network:
    driver: bridge
